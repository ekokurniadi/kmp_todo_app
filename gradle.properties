# Gradle
org.gradle.jvmargs=-Xmx4G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2G

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# KMP / Compose
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true
org.jetbrains.compose.experimental.uikit.enabled=true

# KSP — koin-ksp-compiler 2.0.1 targets KSP1 (the legacy processor); KSP2
# silently no-ops it. Leaving the default (KSP1) on; per-target KSP wiring
# in composeApp/build.gradle.kts handles KMP source set discovery.
# (When koin-annotations is upgraded to 2.1.x the Koin Compiler Plugin
# replaces this entirely.)
